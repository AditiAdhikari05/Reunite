<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backend check</title>
<style>body{font:16px system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.5}pre{background:#f3f3f3;padding:.8rem;overflow:auto;border-radius:6px}input,button{font:inherit;padding:.4rem .6rem}</style></head>
<body><h1>Backend is running</h1>
<p>This is only a placeholder page. The real front end goes in a <code>frontend</code> folder next to <code>backend</code>.</p>
<h2>Health</h2><pre id="h">loading...</pre>
<h2>Authority check</h2><p><input id="pin" type="password" placeholder="access code"> <button onclick="go()">List reports</button></p><pre id="l"></pre>
<script>
fetch('/api/health').then(r=>r.json()).then(j=>h.textContent=JSON.stringify(j,null,2)).catch(e=>h.textContent=e);
function go(){fetch('/api/missing',{headers:{'X-Auth-Pin':pin.value}}).then(r=>r.json()).then(j=>l.textContent=JSON.stringify(j.reports?j.reports.slice(0,5):j,null,2));}
</script></body></html>
